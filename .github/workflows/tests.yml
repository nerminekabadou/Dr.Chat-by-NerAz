name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile app.py main.py sql_guard.py pipeline.py query_runner.py llm_models.py
      - run: pytest -q
      - name: SQL guard fuzzing (no LLM, SQLite)
        run: python -m security.fuzz_guard --check --out /tmp/guard_fuzz.json
